# Ajouts pour le développement, appliqués automatiquement par `docker compose up`.
# Les ports des services ne sont ouverts que sur 127.0.0.1 : accessibles depuis cette machine uniquement.
services:
  # En développement le reverse proxy de Piscord est seul : il publie lui-même le port 80
  # (sur toutes les interfaces, pour pouvoir ouvrir l'application depuis un téléphone du même réseau)
  # et n'a pas de réseau partagé à rejoindre.
  reverseproxy:
    ports:
      - "80:80"
    networks: !override
      - default

  backend:
    build:
      target: dev
    environment:
      # Un seul reverse proxy devant le backend, et pas de HTTPS
      TRUST_PROXY_HOPS: "1"
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      target: dev
    environment:
      # Cible du proxy de `ng serve` (frontend/proxy.conf.mjs) : l'accès direct au port 4200 fonctionne aussi
      BACKEND_URL: http://backend:3000
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  mongo-express:
    image: mongo-express
    ports:
     - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
