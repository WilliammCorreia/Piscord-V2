# Ajouts pour le développement, appliqués automatiquement par `docker compose up`.
# Les ports ne sont ouverts que sur 127.0.0.1 : accessibles depuis cette machine uniquement.
services:
  backend:
    build:
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      target: dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  mongo-express:
    image: mongo-express
    ports:
     - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
