# Sert l'application Angular compilée (image de production du frontend)
server {
    listen 4200;

    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : une URL comme /server/123 n'existe pas sur le disque,
    # on renvoie index.html et le routeur Angular prend le relais
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit pas rester en cache : c'est lui qui pointe vers les fichiers à jour
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les fichiers compilés portent une empreinte dans leur nom : cache longue durée
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
