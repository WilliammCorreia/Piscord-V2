<div class="content">
    <aside>
        <header>
            <a routerLink="/auth">
                <h2>Piscord</h2>
            </a>
        </header>
        <section>
            <div class="users">
                <div class="title">
                    <h3>Utilisateurs</h3>
                </div>
                <article>
                    <ul>
                        <li *ngFor="let member of members">{{member.username}}</li>
                    </ul>
                </article>
            </div>
            <div class="channels">
                <div class="title">
                    <h3>Salons</h3>
                </div>
                <article>
                    <a routerLink="/auth/signup" routerLinkActive="active"># Inscription</a>
                </article>
            </div>
        </section>
    </aside>
    <main>
        <router-outlet></router-outlet>
    </main>
</div>
