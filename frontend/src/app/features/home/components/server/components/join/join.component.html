<div class="content">
  <header>
    <h1># Rejoindre</h1>
  </header>
  <div class="container">
    <form [formGroup]="formGroup" (submit)="onSubmit($event)">
      <div class="inputs">
        <div class="code">
          <label for="code">Code : </label>
          <input
            id="code"
            name="code"
            type="text"
            formControlName="code">
          @if (isFieldValid('code')) {
            <div class="error">
              @if (formGroup.get('code')?.hasError('required')) {
                <div>*Ce champ est requis</div>
              }
              @if (formGroup.get('code')?.hasError('minlength')) {
                <div>*Le code doit contenir au moins 6 caractères</div>
              }
            </div>
          }
        </div>
      </div>
      <div class="submit">
        <button type="submit" [disabled]="formGroup.invalid">Rejoindre</button>
      </div>
    </form>
  </div>
</div>
