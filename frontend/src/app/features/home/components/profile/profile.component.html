<div class="page">
  <header class="page__header">
    <h1># Profil</h1>
  </header>
  <div class="page__body">
    <form class="form">
      <div class="form__fields">
        <div class="field">
          <label for="name">Nom : </label>
          <input
            id="name"
            name="name"
            type="text"
            [value]="name">
        </div>
      </div>
      <div class="form__actions">
        <button type="submit" [disabled]="true">Modifier</button>
      </div>
    </form>
  </div>
</div>
