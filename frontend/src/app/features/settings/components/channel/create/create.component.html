<div class="page">
  <header class="page__header">
    <h1># Créer</h1>
  </header>
  <div class="page__body">
    <form class="form" [formGroup]="formGroup" (submit)="onSubmit($event)">
      <div class="form__fields">
        <div class="field">
          <label for="name">Nom : </label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="off"
            formControlName="name">
          @if (isFieldValid('name')) {
            <div class="error">
              @if (formGroup.get('name')?.hasError('required')) {
                <div>*Ce champ est requis</div>
              }
              @if (formGroup.get('name')?.hasError('minlength')) {
                <div>*Minimum 3 caractères</div>
              }
              @if (formGroup.get('name')?.hasError('maxlength')) {
                <div>*Maximum 24 caractères</div>
              }
            </div>
          }
        </div>
        <div class="field">
          <label for="type">Type : </label>
          <select id="type" name="type" formControlName="type">
            <option value="text">Textuel</option>
            <option value="voice">Vocal</option>
          </select>
        </div>
      </div>
      <div class="form__actions">
        <button type="submit" [disabled]="formGroup.invalid">Créer</button>
      </div>
    </form>
  </div>
</div>
