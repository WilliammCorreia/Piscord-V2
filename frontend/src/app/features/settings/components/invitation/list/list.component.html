<div class="page">
  <header class="page__header">
    <h1># Lister</h1>
  </header>
  <div class="page__body">
    <ul class="list">
      @for (invitation of invitations; track invitation._id) {
        <li class="list__item">
          <span class="invitation-code">{{ invitation.code }}</span>
        </li>
      } @empty {
        <li class="list__empty">Aucune invitation pour ce serveur.</li>
      }
    </ul>
  </div>
</div>
