# WebSocket : nginx ne transmet pas l'en-tête Upgrade tout seul. Sans ces lignes,
# Socket.io retombe sur du long-polling HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    proxy_http_version 1.1;

    # Définis une seule fois ici : un proxy_set_header placé dans un bloc location
    # annulerait tous ceux hérités du bloc server.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://frontend:4200;
    }

    location /api {
        proxy_pass http://backend:3000;
    }

    location /socket.io {
        proxy_pass http://backend:3000;
    }
}
