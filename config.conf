# WebSocket : nginx ne transmet pas l'en-tête Upgrade tout seul. Sans ces lignes,
# Socket.io retombe sur du long-polling HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# En production, c'est le reverse proxy du VPS qui reçoit le visiteur en HTTPS : on transmet
# le protocole qu'il annonce. Sans lui (développement), c'est celui de la requête reçue ici.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Les noms des conteneurs sont résolus à chaque requête par le DNS interne de Docker, et non
    # une fois pour toutes au démarrage : lors d'une mise à jour, les conteneurs recréés changent
    # d'adresse et nginx continuerait d'écrire à l'ancienne (erreur 502 jusqu'à son redémarrage).
    # C'est le passage par une variable dans proxy_pass qui déclenche cette résolution.
    # Les noms « piscord-… » sont des alias déclarés dans docker-compose.yml.
    resolver 127.0.0.11 valid=10s;
    set $frontend http://piscord-frontend:4200;
    set $backend  http://piscord-backend:3000;

    proxy_http_version 1.1;

    # Définis une seule fois ici : un proxy_set_header placé dans un bloc location
    # annulerait tous ceux hérités du bloc server.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass $frontend;
    }

    location /api {
        proxy_pass $backend;
    }

    location /socket.io {
        proxy_pass $backend;
    }
}
