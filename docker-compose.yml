# Configuration de production. En local, docker-compose.override.yml s'y ajoute automatiquement.
# Pour lancer la production seule : docker compose -f docker-compose.yml up --build
services:
  # Seul service exposé : tout passe par lui (frontend, /api, /socket.io)
  reverseproxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      # Ajouter "443:443" quand le TLS sera configuré (et passer COOKIE_SECURE à true)
    volumes:
      - ./config.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod

  # Pas de port publié : la base n'est joignable que par le backend, sur le réseau Docker
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
