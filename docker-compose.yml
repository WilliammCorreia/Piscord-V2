services:
  reverseproxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config.conf:/etc/nginx/conf.d/core.conf
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: prod
    ports: 
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
  
  frontend:
    build:
      context: ./frontend
      # target: prod
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app

  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data: