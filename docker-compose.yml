services:
  mongodb:
    image: mongo:8.0
    container_name: piscord-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: piscord-backend
    ports: 
      - "3000:3000"
    depends_on:
      - mongodb
  
  frontend:
    build:
      context: ./frontend
    container_name: piscord-frontend
    ports: 
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb-data: