version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/piscord
      - JWT_SECRET=votre-secret-key-super-secure
      - FRONTEND_ADDRESS=http://localhost
    depends_on:
      - mongodb
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: 
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb-data: