services:
  reverseproxy:
    image: nginx:1.30.0-alpine3.23-slim
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - piscord-frontend
      - piscord-backend

  backend:
    build:
      context: ./backend
      target: prod
    networks:
      - piscord-backend
      - piscord-database
    expose:
      - "3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
  
  frontend:
    build:
      context: ./frontend
      target: prod
    expose:
      - "4200"
    volumes:
      - ./frontend:/app
    networks:
      - piscord-frontend

  mongodb:
    image: mongo:8.0
    expose:
      - "27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - piscord-database

networks:
  piscord-frontend:
    driver: bridge
  piscord-backend:
    driver: bridge
  piscord-database:
    driver: bridge

volumes:
  mongodb-data: