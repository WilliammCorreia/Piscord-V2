services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/piscord?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_ADDRESS=http://localhost
    depends_on:
      - mongodb
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: 
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb-data: